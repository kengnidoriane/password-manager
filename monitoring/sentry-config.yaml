# Sentry Error Tracking Configuration
---
# Sentry ConfigMap for Backend
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentry-config-backend
  namespace: password-manager
data:
  SENTRY_ENABLED: "true"
  SENTRY_ENVIRONMENT: "production"
  SENTRY_TRACES_SAMPLE_RATE: "0.1"
  SENTRY_SEND_DEFAULT_PII: "false"
  SENTRY_ATTACH_STACKTRACE: "true"
  SENTRY_ENABLE_TRACING: "true"

---
# Sentry ConfigMap for Frontend
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentry-config-frontend
  namespace: password-manager
data:
  NEXT_PUBLIC_SENTRY_ENABLED: "true"
  NEXT_PUBLIC_SENTRY_ENVIRONMENT: "production"
  NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "0.1"
  NEXT_PUBLIC_SENTRY_REPLAY_SESSION_SAMPLE_RATE: "0.1"
  NEXT_PUBLIC_SENTRY_REPLAY_ON_ERROR_SAMPLE_RATE: "1.0"

---
# Sentry Secret (DSN should be stored securely)
apiVersion: v1
kind: Secret
metadata:
  name: sentry-dsn
  namespace: password-manager
type: Opaque
stringData:
  backend-dsn: "https://examplePublicKey@o0.ingest.sentry.io/0"
  frontend-dsn: "https://examplePublicKey@o0.ingest.sentry.io/0"
