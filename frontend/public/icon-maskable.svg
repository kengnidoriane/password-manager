<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Safe area circle for maskable icon -->
  <circle cx="256" cy="256" r="256" fill="#3b82f6"/>
  
  <!-- Icon content within safe area (80% of radius) -->
  <g transform="translate(256,256)">
    <!-- Lock icon -->
    <rect x="-40" y="-20" width="80" height="60" rx="8" fill="white" stroke="none"/>
    <rect x="-30" y="-10" width="60" height="40" fill="#3b82f6"/>
    <circle cx="0" cy="-40" r="25" fill="none" stroke="white" stroke-width="8"/>
    <circle cx="0" cy="5" r="6" fill="white"/>
    <rect x="-2" y="11" width="4" height="12" fill="white"/>
  </g>
</svg>