apiVersion: v1
kind: Secret
metadata:
  name: password-manager-secrets
  namespace: password-manager
  labels:
    app: password-manager
type: Opaque
stringData:
  # Database Credentials
  # IMPORTANT: Replace these with actual secure values before deployment
  # Consider using external secret management (e.g., HashiCorp Vault, AWS Secrets Manager)
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"
  POSTGRES_DB: "password_manager"
  
  # Redis Password
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  
  # JWT Secret (must be at least 256 bits / 32 bytes)
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_AT_LEAST_32_CHARACTERS_LONG_FOR_SECURITY"
  
  # Email Configuration (for account recovery notifications)
  SPRING_MAIL_USERNAME: "noreply@passwordmanager.example.com"
  SPRING_MAIL_PASSWORD: "CHANGE_ME_EMAIL_PASSWORD"
  SPRING_MAIL_HOST: "smtp.example.com"
  SPRING_MAIL_PORT: "587"
  
---
# TLS Secret for Ingress
# This should be created from actual TLS certificates
# kubectl create secret tls password-manager-tls \
#   --cert=path/to/tls.crt \
#   --key=path/to/tls.key \
#   -n password-manager
apiVersion: v1
kind: Secret
metadata:
  name: password-manager-tls
  namespace: password-manager
  labels:
    app: password-manager
type: kubernetes.io/tls
data:
  # Base64 encoded TLS certificate and key
  # Replace with actual certificate data
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCi4uLgotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0t
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCi4uLgotLS0tLUVORCBQUklWQVRFIEtFWS0tLS0t
