# Prometheus Alerting Rules for Password Manager
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: password-manager-alerts
  namespace: monitoring
  labels:
    app: password-manager
    prometheus: kube-prometheus
spec:
  groups:
    # Application Health Alerts
    - name: application-health
      interval: 30s
      rules:
        - alert: BackendDown
          expr: up{job="password-manager-backend"} == 0
          for: 2m
          labels:
            severity: critical
            component: backend
          annotations:
            summary: "Backend service is down"
            description: "Backend service {{ $labels.instance }} has been down for more than 2 minutes."

        - alert: FrontendDown
          expr: up{job="password-manager-frontend"} == 0
          for: 2m
          labels:
            severity: critical
            component: frontend
          annotations:
            summary: "Frontend service is down"
            description: "Frontend service {{ $labels.instance }} has been down for more than 2 minutes."

        - alert: HighErrorRate
          expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "High error rate detected"
            description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.uri }}"

        - alert: CriticalErrorRate
          expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.1
          for: 2m
          labels:
            severity: critical
            component: backend
          annotations:
            summary: "Critical error rate detected"
            description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.uri }}"

    # Performance Alerts
    - name: performance
      interval: 30s
      rules:
        - alert: HighResponseTime
          expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 1
          for: 5m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "High response time detected"
            description: "95th percentile response time is {{ $value }}s for {{ $labels.uri }}"

        - alert: CriticalResponseTime
          expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 3
          for: 2m
          labels:
            severity: critical
            component: backend
          annotations:
            summary: "Critical response time detected"
            description: "95th percentile response time is {{ $value }}s for {{ $labels.uri }}"

        - alert: HighCPUUsage
          expr: rate(process_cpu_usage[5m]) > 0.8
          for: 10m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "High CPU usage"
            description: "CPU usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

        - alert: HighMemoryUsage
          expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
          for: 10m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "High memory usage"
            description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

    # Database Alerts
    - name: database
      interval: 30s
      rules:
        - alert: DatabaseConnectionPoolExhausted
          expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
          for: 5m
          labels:
            severity: critical
            component: database
          annotations:
            summary: "Database connection pool nearly exhausted"
            description: "Connection pool usage is {{ $value | humanizePercentage }}"

        - alert: SlowDatabaseQueries
          expr: rate(database_query_duration_seconds_sum[5m]) / rate(database_query_duration_seconds_count[5m]) > 0.5
          for: 5m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "Slow database queries detected"
            description: "Average query time is {{ $value }}s"

        - alert: HighDatabaseErrorRate
          expr: rate(database_errors_total[5m]) > 0.01
          for: 5m
          labels:
            severity: warning
            component: database
          annotations:
            summary: "High database error rate"
            description: "Database error rate is {{ $value }} errors/sec"

    # Redis Alerts
    - name: redis
      interval: 30s
      rules:
        - alert: RedisDown
          expr: redis_up == 0
          for: 2m
          labels:
            severity: critical
            component: redis
          annotations:
            summary: "Redis is down"
            description: "Redis instance {{ $labels.instance }} is down"

        - alert: RedisHighMemoryUsage
          expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
          for: 5m
          labels:
            severity: warning
            component: redis
          annotations:
            summary: "Redis high memory usage"
            description: "Redis memory usage is {{ $value | humanizePercentage }}"

        - alert: RedisHighConnectionCount
          expr: redis_connected_clients > 1000
          for: 5m
          labels:
            severity: warning
            component: redis
          annotations:
            summary: "High Redis connection count"
            description: "Redis has {{ $value }} connected clients"

    # Security Alerts
    - name: security
      interval: 30s
      rules:
        - alert: HighFailedLoginAttempts
          expr: rate(authentication_failures_total[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
            component: security
          annotations:
            summary: "High failed login attempts"
            description: "Failed login rate is {{ $value }} attempts/sec"

        - alert: RateLimitExceeded
          expr: rate(rate_limit_exceeded_total[5m]) > 1
          for: 5m
          labels:
            severity: warning
            component: security
          annotations:
            summary: "Rate limit frequently exceeded"
            description: "Rate limit exceeded {{ $value }} times/sec"

        - alert: SuspiciousActivity
          expr: rate(suspicious_activity_total[5m]) > 0.01
          for: 2m
          labels:
            severity: critical
            component: security
          annotations:
            summary: "Suspicious activity detected"
            description: "Suspicious activity rate is {{ $value }} events/sec"

    # Business Metrics Alerts
    - name: business-metrics
      interval: 1m
      rules:
        - alert: LowUserRegistrations
          expr: rate(user_registrations_total[1h]) < 0.001
          for: 2h
          labels:
            severity: info
            component: business
          annotations:
            summary: "Low user registration rate"
            description: "User registration rate is {{ $value }} users/sec"

        - alert: HighVaultSyncFailures
          expr: rate(vault_sync_failures_total[5m]) > 0.05
          for: 10m
          labels:
            severity: warning
            component: sync
          annotations:
            summary: "High vault sync failure rate"
            description: "Sync failure rate is {{ $value | humanizePercentage }}"

    # Infrastructure Alerts
    - name: infrastructure
      interval: 30s
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
          for: 5m
          labels:
            severity: warning
            component: kubernetes
          annotations:
            summary: "Pod is crash looping"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is crash looping"

        - alert: PodNotReady
          expr: kube_pod_status_phase{phase!="Running"} == 1
          for: 10m
          labels:
            severity: warning
            component: kubernetes
          annotations:
            summary: "Pod not ready"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is not ready"

        - alert: HighPodMemoryUsage
          expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
          for: 5m
          labels:
            severity: warning
            component: kubernetes
          annotations:
            summary: "High pod memory usage"
            description: "Pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }}"

        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
            component: kubernetes
          annotations:
            summary: "Node not ready"
            description: "Node {{ $labels.node }} is not ready"
