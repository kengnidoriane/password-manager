apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: password-manager
  labels:
    app: password-manager
    component: backend
data:
  # Spring Boot Configuration
  SPRING_PROFILES_ACTIVE: "prod"
  
  # Database Configuration
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/password_manager"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
  
  # Redis Configuration
  SPRING_REDIS_HOST: "redis-service"
  SPRING_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_TIMEOUT: "60000"
  
  # JWT Configuration
  JWT_EXPIRATION: "900000"  # 15 minutes
  
  # Session Configuration
  SESSION_TIMEOUT: "900"  # 15 minutes in seconds
  
  # CORS Configuration
  CORS_ALLOWED_ORIGINS: "https://passwordmanager.example.com"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "*"
  CORS_ALLOW_CREDENTIALS: "true"
  
  # Actuator Configuration
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,metrics,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "when-authorized"
  MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
  
  # Logging Configuration
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_PASSWORDMANAGER: "INFO"
  LOGGING_PATTERN_CONSOLE: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  
  # Rate Limiting Configuration
  RATE_LIMIT_AUTH_CAPACITY: "5"
  RATE_LIMIT_AUTH_REFILL_TOKENS: "5"
  RATE_LIMIT_AUTH_REFILL_DURATION: "60"
  RATE_LIMIT_VAULT_CAPACITY: "100"
  RATE_LIMIT_VAULT_REFILL_TOKENS: "100"
  RATE_LIMIT_VAULT_REFILL_DURATION: "60"
  
  # File Upload Configuration
  SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "10MB"
  SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "10MB"
