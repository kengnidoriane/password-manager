apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: password-manager-ingress
  namespace: password-manager-staging
spec:
  tls:
    - hosts:
        - staging.passwordmanager.example.com
        - api-staging.passwordmanager.example.com
      secretName: password-manager-tls-staging
  rules:
    - host: staging.passwordmanager.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
    - host: api-staging.passwordmanager.example.com
      http:
        paths:
          - path: /api/v1(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
