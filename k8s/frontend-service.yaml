apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: password-manager
  labels:
    app: password-manager
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: password-manager
    component: frontend
