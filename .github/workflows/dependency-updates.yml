name: Automated Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-frontend-dependencies:
    name: Update Frontend Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Update dependencies
        working-directory: ./frontend
        run: |
          npm update
          npm audit fix || true
      
      - name: Run tests
        working-directory: ./frontend
        run: npm test
        continue-on-error: true
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update frontend dependencies'
          title: 'chore(deps): Update Frontend Dependencies'
          body: |
            ## Automated Dependency Update
            
            This PR updates frontend dependencies to their latest compatible versions.
            
            ### Changes
            - Updated npm dependencies
            - Applied security fixes from npm audit
            
            ### Testing
            - [ ] All tests pass
            - [ ] No breaking changes detected
            - [ ] Security vulnerabilities addressed
            
            **Note:** Please review the changes carefully before merging.
          branch: automated/update-frontend-deps
          delete-branch: true
          labels: dependencies, automated

  update-backend-dependencies:
    name: Update Backend Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Update Maven dependencies
        working-directory: ./backend
        run: |
          mvn versions:use-latest-releases -DallowMajorUpdates=false
          mvn versions:update-properties
      
      - name: Run tests
        working-directory: ./backend
        run: mvn test
        continue-on-error: true
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update backend dependencies'
          title: 'chore(deps): Update Backend Dependencies'
          body: |
            ## Automated Dependency Update
            
            This PR updates backend Maven dependencies to their latest compatible versions.
            
            ### Changes
            - Updated Maven dependencies
            - Updated dependency versions in pom.xml
            
            ### Testing
            - [ ] All tests pass
            - [ ] No breaking changes detected
            - [ ] Security vulnerabilities addressed
            
            **Note:** Please review the changes carefully before merging.
          branch: automated/update-backend-deps
          delete-branch: true
          labels: dependencies, automated

  dependabot-auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      
      - name: Enable auto-merge for Dependabot PRs
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
